name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore Obo.slnx
    - name: Build
      run: dotnet build Obo.slnx --no-restore
    - name: Test
      run: dotnet test Obo.slnx --no-build --verbosity normal
